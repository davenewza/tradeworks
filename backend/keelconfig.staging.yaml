environment:
  - name: SHIPLOGIC_API_URL
    value: "https://api.shiplogic.com/v2/rates"
  - name: ZOHO_BOOKS_BASE_URL
    value: "https://www.zohoapis.com/books/v3"
  - name: ZOHO_BOOKS_ORG_ID
    value: "756529239" 
  - name: ZOHO_ACCOUNTS_BASE_URL
    value: "https://accounts.zoho.com"
  - name: ZOHO_CLIENT_ID
    value: "1000.9X0VMF7WCARWJSGFJMASJE8YOI2DRB"

  # Supplier delivery tracking (see docs/supplier-deliveries.md)
  # EasyPost fronts FedEx, DHL and UPS for courier consignments; VesselAPI covers
  # sea freight by vessel.
  - name: EASYPOST_API_BASE_URL
    value: "https://api.easypost.com"
  - name: VESSEL_API_BASE_URL
    value: "https://api.vesselapi.com"

  # Takealot Marketplace API. Two things are read from it: an offer's
  # product_label, which holds the EAN printed on channel unit labels
  # (docs/takealot-barcodes.md), and the shipments going into Takealot's
  # fulfilment centre (docs/channel-shipments.md). Neither draws on the shared
  # Zoho quota.
  - name: TAKEALOT_API_BASE_URL
    value: "https://marketplace-api.takealot.com"

secrets:
  # Outbound delivery to customers: SHIPLOGIC_API_KEY calls ShipLogic for live
  # courier rates; DELIVERY_API_KEY is the X-API-KEY partners must send to our own
  # getDeliveryRates endpoint (docs/delivery-rates-api.md). Unrelated to the
  # inbound supplier-delivery tracking secrets below.
  - name: SHIPLOGIC_API_KEY
  - name: DELIVERY_API_KEY
  - name: ZOHO_CLIENT_SECRET
  # Inbound deliveries from suppliers. The EasyPost key is used as the HTTP Basic
  # username; no per-carrier credentials are needed on top of it.
  - name: EASYPOST_API_KEY
  - name: VESSEL_API_KEY
  # Takealot Marketplace API key (Seller Portal → API Access), sent as
  # X-API-Key. Only one key can be active per seller account — regenerating it
  # invalidates the old one everywhere it is used.
  - name: TAKEALOT_API_KEY

auth:
  userProvisioning: auto
  redirectUrl: http://localhost:3000/callback
  providers:
    - type: google
      name: google_client
      clientId: 197248210825-lmlmjjo4hkvaqslk79colj1c15l001mu.apps.googleusercontent.com

# Label printers driven from flows via ctx.ui.interactive.print. Channel unit
# barcodes (PrintChannelBarcodes) go out as ZPL — see
# docs/channel-barcode-labels.md. The name is what the flow references; the
# physical device it resolves to is bound in the Console.
hardware:
  printers:
    - name: Barcode labels
