environment:
  # Tests run against a local mock ShipLogic server started by the test
  # suite (see tests/getDeliveryRates.test.ts) so no real network calls
  # are made.
  - name: SHIPLOGIC_API_URL
    value: "http://127.0.0.1:59991/rates"
  - name: ZOHO_BOOKS_BASE_URL
    value: "https://www.zohoapis.com/books/v3"
  - name: ZOHO_BOOKS_ORG_ID
    value: "756529239"
  - name: ZOHO_ACCOUNTS_BASE_URL
    value: "https://accounts.zoho.com"
  - name: ZOHO_CLIENT_ID
    value: "1000.9X0VMF7WCARWJSGFJMASJE8YOI2DRB"

secrets:
  - name: SHIPLOGIC_API_KEY
  - name: DELIVERY_API_KEY
  - name: ZOHO_CLIENT_SECRET

auth:
  userProvisioning: auto
  redirectUrl: http://localhost:3000/callback
  providers:
    - type: google
      name: google_client
      clientId: 197248210825-lmlmjjo4hkvaqslk79colj1c15l001mu.apps.googleusercontent.com
