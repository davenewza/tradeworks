environment:
  # The Courier Guy moved off the shared ShipLogic host in May 2026. Keys issued
  # by the TCG portal are rejected by api.shiplogic.com with a 401; they only
  # work against TCG's own ShipLogic-powered API, which has the same rates schema.
  # thecourierguy.co.za/api-docs documents /rates; /v2/rates also answers identically.
  - name: SHIPLOGIC_API_URL
    value: "https://api.portal.thecourierguy.co.za/rates"
  - name: ZOHO_BOOKS_BASE_URL
    value: "https://www.zohoapis.com/books/v3"
  - name: ZOHO_BOOKS_ORG_ID
    value: "756529239" 
  - name: ZOHO_ACCOUNTS_BASE_URL
    value: "https://accounts.zoho.com"
  - name: ZOHO_CLIENT_ID
    value: "1000.9X0VMF7WCARWJSGFJMASJE8YOI2DRB"

  # Supplier delivery tracking (see docs/supplier-deliveries.md)
  # EasyPost fronts FedEx, DHL and UPS for courier consignments; VesselAPI covers
  # sea freight by vessel.
  - name: EASYPOST_API_BASE_URL
    value: "https://api.easypost.com"
  - name: VESSEL_API_BASE_URL
    value: "https://api.vesselapi.com"

  # Takealot Marketplace API. Two things are read from it: an offer's
  # product_label, which holds the EAN printed on channel unit labels
  # (docs/takealot-barcodes.md), and the shipments going into Takealot's
  # fulfilment centre (docs/channel-shipments.md). Neither draws on the shared
  # Zoho quota.
  - name: TAKEALOT_API_BASE_URL
    value: "https://marketplace-api.takealot.com"

  # Amazon Selling Partner API. Read for each FBA listing's FNSKU, the code on
  # Amazon unit labels (docs/amazon-fnskus.md), and for the FBA inbound
  # consignments those labels are printed for (docs/channel-shipments.md). Both
  # need the app's Amazon Fulfillment role. Amazon.co.za is served by the
  # EU regional endpoint; the marketplace ID is Amazon South Africa's. Login
  # with Amazon issues the access tokens; the client ID is the seller's own
  # SP-API app's, and like the Zoho client ID it is an identifier rather than
  # a secret. None of this touches the Zoho quota.
  - name: AMAZON_SP_API_BASE_URL
    value: "https://sellingpartnerapi-eu.amazon.com"
  - name: AMAZON_LWA_TOKEN_URL
    value: "https://api.amazon.com/auth/o2/token"
  - name: AMAZON_MARKETPLACE_ID
    value: "AE08WJ6YKNBMC"
  - name: AMAZON_LWA_CLIENT_ID
    value: "amzn1.application-oa2-client.e88c664850844dbb9769e8a918894a9f"

secrets:
  # Outbound delivery to customers: SHIPLOGIC_API_KEY calls ShipLogic for live
  # courier rates; DELIVERY_API_KEY is the X-API-KEY partners must send to our own
  # getDeliveryRates endpoint (docs/delivery-rates-api.md). Unrelated to the
  # inbound supplier-delivery tracking secrets below.
  - name: SHIPLOGIC_API_KEY
  - name: DELIVERY_API_KEY
  - name: ZOHO_CLIENT_SECRET
  # Inbound deliveries from suppliers. The EasyPost key is used as the HTTP Basic
  # username; no per-carrier credentials are needed on top of it.
  - name: EASYPOST_API_KEY
  - name: VESSEL_API_KEY
  # Takealot Marketplace API key (Seller Portal → API Access), sent as
  # X-API-Key. Only one key can be active per seller account — regenerating it
  # invalidates the old one everywhere it is used.
  - name: TAKEALOT_API_KEY
  # Amazon SP-API: the Login with Amazon client secret of the seller's own
  # app (Seller Central → Apps & Services → Develop Apps; the client ID is the
  # AMAZON_LWA_CLIENT_ID env var above) and the refresh token from
  # self-authorising it. Exchanged for a one-hour access token on every sync;
  # no AWS keys or request signing are needed.
  - name: AMAZON_LWA_CLIENT_SECRET
  - name: AMAZON_LWA_REFRESH_TOKEN

auth:
  userProvisioning: auto
  redirectUrl: http://localhost:3000/callback
  # Allow-list for the redirectUrl the frontend passes to the built-in
  # requestPasswordReset action; the emailed link is this URL plus ?token=.
  # Without it Keel rejects every reset with "auth.passwordResetUrl must be
  # configured". Must be the frontend's /reset-password page.
  passwordResetUrl: http://localhost:3000/reset-password
  providers:
    - type: google
      name: google_client
      clientId: 197248210825-lmlmjjo4hkvaqslk79colj1c15l001mu.apps.googleusercontent.com

# Label printers driven from flows via ctx.ui.interactive.print. Channel unit
# barcodes (PrintChannelBarcodes) go out as ZPL — see
# docs/channel-barcode-labels.md. The name is what the flow references; the
# physical device it resolves to is bound in the Console.
hardware:
  printers:
    - name: Barcode labels
